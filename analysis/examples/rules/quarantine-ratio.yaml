apiVersion: raven.io/v1
kind: AnalysisRule
metadata:
  name: elevated-quarantine-ratio
  version: 1.0.0
  description: Flag sources whose recent completed records are frequently quarantined
spec:
  kind: quality
  match:
    fields: []
  window:
    signal: quarantine_ratio
    duration: 5m
    ratioAtLeast: 0.25
    clearRatio: 0.1
  finding:
    severity: high
    state: yellow
    title: Elevated quarantine ratio
    clearAfter: 1m
