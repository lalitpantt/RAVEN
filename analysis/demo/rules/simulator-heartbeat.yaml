apiVersion: raven.io/v1
kind: AnalysisRule
metadata:
  name: simulator-heartbeat
  version: 1.0.0
  description: Identifies the one-shot payment heartbeat emitted by logsim
spec:
  kind: heartbeat
  match:
    fields:
      - path: activity_name
        op: eq
        value: heartbeat
  finding:
    severity: medium
    state: yellow
    title: Simulator heartbeat is late
